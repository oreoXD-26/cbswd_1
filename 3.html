<!DOCTYPE html>
<html>
<head>
    <title>Table Layout</title>

</head>

<body>

<table border="5" style="height: 300px; width: 500px;text-align: center;">
    <tr>
        <td rowspan="2">A</td>
        <td>B</td>
        <td rowspan="3">D</td>
        <td colspan="2">E</td>
        <td>F</td>
    </tr>

    <tr style="height: 60%; width: 800px;">
        <td>C</td>
        <td rowspan="2">G</td>
        <td rowspan="2">H</td>
        <td rowspan="2">I</td>
    </tr>

    <tr>
        <td colspan="2">J</td>
        
    </tr>

    <tr>
        <td colspan="3">K</td>
        <td>L</td>
        <td colspan="2">M</td>
    </tr>
</table>

</body>
</html>
